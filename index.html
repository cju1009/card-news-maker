<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>카드뉴스 메이커</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 18px;
      color: #f4f4f5;
      background: #101116;
      font: 15px Arial, sans-serif;
    }
    h1 {
      max-width: 1200px;
      margin: 0 auto 16px;
      font-size: 22px;
    }
    .layout {
      display: grid;
      grid-template-columns: minmax(270px,330px) minmax(300px,1fr) minmax(270px,330px);
      gap: 16px;
      max-width: 1200px;
      margin: auto;
      align-items: start;
    }
    .panel, .preview {
      background: #181a22;
      border: 1px solid #292c36;
      border-radius: 12px;
      padding: 16px;
    }
    .field { margin-bottom: 13px; }
    label {
      display: block;
      margin: 0 0 7px;
      color: #d5d6dc;
      font-size: 13px;
      font-weight: bold;
    }
    input, select, textarea, button {
      width: 100%;
      padding: 10px;
      color: #f4f4f5;
      background: #111319;
      border: 1px solid #343743;
      border-radius: 7px;
      font: inherit;
    }
    textarea { resize: vertical; min-height: 86px; }
    input[type="file"] { padding: 9px; }
    input[type="color"] { height: 42px; padding: 5px; }
    input[type="range"] { padding: 0; accent-color: #6941f5; }
    button {
      border: 0;
      background: #292c36;
      font-weight: bold;
      cursor: pointer;
    }
    button.primary { background: #6941f5; }
    button:disabled { opacity: .55; cursor: wait; }
    .help, .status {
      font-size: 12px;
      line-height: 1.5;
      color: #aeb4c3;
      margin-top: 6px;
    }
    .status { color: #c7b8ff; white-space: pre-wrap; }
    .card-frame { max-width: 390px; margin: auto; }
    .canvas-wrap {
      width: 100%;
      aspect-ratio: 4 / 5;
      background: #222032;
      border-radius: 10px;
      overflow: hidden;
    }
    .canvas-wrap canvas {
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
    }
    .nav {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 10px;
    }
    .nav button { padding: 12px; }
    .action {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 10px;
    }
    .hint {
      font-size: 12px;
      line-height: 1.5;
      color: #aeb4c3;
      margin-top: 8px;
    }
    .slider-value { font-weight: normal; color: #aaa; margin-left: 4px; }
    .section-title { font-weight: bold; margin: 2px 0 12px; }
    @media (max-width: 850px) {
      .layout { grid-template-columns: 1fr; }
      .card-frame { max-width: min(100%, 390px); }
    }
  </style>
</head>
<body>
  <h1>카드뉴스 메이커</h1>

  <main class="layout">
    <section class="panel">
      <div class="field">
        <label for="workerUrl">AI 연결 주소</label>
        <input id="workerUrl" type="url" placeholder="Cloudflare Worker 주소를 입력하세요">
        <div class="help">접속 암호가 포함된 주소를 입력하세요. 이 주소를 다른 사람과 공유하지 마세요.</div>
      </div>

      <div class="field">
        <label for="sourceImage">① 번역할 문구가 있는 사진</label>
        <input id="sourceImage" type="file" accept="image/*">
        <div class="help">사진 속 가장 크고 눈에 띄는 제목만 읽어 번역합니다. 이 사진 자체는 카드에 들어가지 않습니다.</div>
      </div>

      <div class="field">
        <label for="targetLanguage">번역할 언어</label>
        <select id="targetLanguage">
          <option>한국어</option>
          <option>영어</option>
          <option>일본어</option>
          <option>중국어(간체)</option>
          <option>스페인어</option>
          <option>프랑스어</option>
          <option>독일어</option>
        </select>
      </div>

      <div class="field">
        <button id="translateButton" class="primary">사진 속 큰 글씨 번역</button>
        <div id="status" class="status" role="status"></div>
      </div>

      <div class="field">
        <label for="backgroundImage">② 번역된 글씨를 얹을 배경 사진</label>
        <input id="backgroundImage" type="file" accept="image/*">
        <div class="help">이 사진만 카드 배경으로 사용됩니다. 사진은 브라우저에서 처리되며 번역 요청에 포함되지 않습니다.</div>
      </div>

      <div class="action">
        <button id="addCardButton">카드 추가</button>
        <button id="downloadButton" class="primary">현재 카드 PNG 다운로드</button>
      </div>
    </section>

    <section class="preview">
      <div class="card-frame">
        <div class="canvas-wrap">
          <canvas id="cardCanvas" width="1080" height="1350"></canvas>
        </div>
        <div class="nav">
          <button id="previousButton">이전 카드</button>
          <button id="nextButton">다음 카드</button>
        </div>
        <div class="hint">번역된 제목은 사진 위에 표시됩니다. 미리보기에서 제목을 끌어 위치를 옮길 수 있어요.</div>
      </div>
    </section>

    <section class="panel">
      <div class="section-title">카드 글씨와 배경 설정</div>
      <div class="field">
        <label for="translatedTitle">번역된 제목 (직접 수정 가능)</label>
        <textarea id="translatedTitle" placeholder="먼저 왼쪽에서 사진 속 큰 글씨를 번역하세요."></textarea>
      </div>
      <div class="field">
        <label for="fontSize">글자 크기 <span id="fontSizeValue" class="slider-value"></span></label>
        <input id="fontSize" type="range" min="42" max="112" value="72">
      </div>
      <div class="field">
        <label for="textColor">글자 색</label>
        <input id="textColor" type="color" value="#ffffff">
      </div>
      <div class="field">
        <label for="gradientStrength">글자 뒤 그라데이션 강도 <span id="gradientValue" class="slider-value">55%</span></label>
        <input id="gradientStrength" type="range" min="0" max="100" value="55">
        <div class="help">0%는 그라데이션 없음, 100%는 글자 뒤가 가장 어둡게 흐려집니다.</div>
      </div>
      <div class="field">
        <label for="fallbackColor">사진이 없을 때 배경 색</label>
        <input id="fallbackColor" type="color" value="#242033">
      </div>
    </section>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    const canvas = $("cardCanvas");
    const ctx = canvas.getContext("2d");
    const cards = [{
      title: "",
      image: null,
      x: 540,
      y: 675,
      fontSize: 72,
      color: "#ffffff",
      gradient: 55,
      fallback: "#242033"
    }];
    let current = 0;
    let dragging = false;
    let dragOffset = { x: 0, y: 0 };
    const card = () => cards[current];

    $("workerUrl").value = localStorage.getItem("cardNewsWorkerUrl") || "";
    $("workerUrl").addEventListener("input", () => {
      localStorage.setItem("cardNewsWorkerUrl", $("workerUrl").value);
    });

    function saveInputs() {
      if (!card()) return;
      card().title = $("translatedTitle").value;
      card().fontSize = Number($("fontSize").value);
      card().color = $("textColor").value;
      card().gradient = Number($("gradientStrength").value);
      card().fallback = $("fallbackColor").value;
    }

    function loadCard() {
      const c = card();
      $("translatedTitle").value = c.title;
      $("fontSize").value = c.fontSize;
      $("fontSizeValue").textContent = `${c.fontSize}px`;
      $("textColor").value = c.color;
      $("gradientStrength").value = c.gradient;
      $("gradientValue").textContent = `${c.gradient}%`;
      $("fallbackColor").value = c.fallback;
      draw();
    }

    function wrapText(text, maxWidth) {
      const lines = [];
      for (const paragraph of String(text || "").split("\n")) {
        if (!paragraph) {
          lines.push("");
          continue;
        }
        let line = "";
        for (const char of paragraph) {
          const test = line + char;
          if (line && ctx.measureText(test).width > maxWidth) {
            lines.push(line);
            line = char;
          } else {
            line = test;
          }
        }
        if (line) lines.push(line);
      }
      return lines;
    }

    function draw() {
      const c = card();
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = c.fallback;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      if (c.image && c.image.complete) {
        const scale = Math.max(
          canvas.width / c.image.width,
          canvas.height / c.image.height
        );
        const w = c.image.width * scale;
        const h = c.image.height * scale;
        ctx.drawImage(
          c.image,
          (canvas.width - w) / 2,
          (canvas.height - h) / 2,
          w,
          h
        );
      }

      const title = c.title.trim();
      if (!title) return;

      const strength = c.gradient / 100;
      if (strength > 0) {
        const fadeHeight = 650;
        const grad = ctx.createLinearGradient(
          0,
          Math.max(0, c.y - fadeHeight / 2),
          0,
          Math.min(canvas.height, c.y + fadeHeight / 2)
        );
        grad.addColorStop(0, "rgba(0,0,0,0)");
        grad.addColorStop(0.25, `rgba(0,0,0,${strength * 0.62})`);
        grad.addColorStop(0.72, `rgba(0,0,0,${strength * 0.9})`);
        grad.addColorStop(1, `rgba(0,0,0,${strength * 0.55})`);
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }

      ctx.font = `bold ${c.fontSize}px Arial, sans-serif`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      const lines = wrapText(title, 900);
      const lineHeight = c.fontSize * 1.28;
      const startY = c.y - (lines.length - 1) * lineHeight / 2;
      ctx.lineWidth = Math.max(2, c.fontSize / 18);
      ctx.strokeStyle = "rgba(0,0,0,.45)";
      ctx.fillStyle = c.color;

      lines.forEach((line, i) => {
        const y = startY + i * lineHeight;
        ctx.strokeText(line, c.x, y, 920);
        ctx.fillText(line, c.x, y, 920);
      });
    }

    function readImage(file) {
      return new Promise((resolve, reject) => {
        const url = URL.createObjectURL(file);
        const img = new Image();
        img.onload = () => {
          URL.revokeObjectURL(url);
          resolve(img);
        };
        img.onerror = () => {
          URL.revokeObjectURL(url);
          reject(new Error("사진 파일을 열지 못했습니다."));
        };
        img.src = url;
      });
    }

    $("translateButton").addEventListener("click", async () => {
      const file = $("sourceImage").files[0];
      const workerAddress = $("workerUrl").value.trim();

      if (!file) {
        $("status").textContent = "먼저 번역할 문구가 있는 사진을 선택하세요.";
        return;
      }
      if (!workerAddress) {
        $("status").textContent = "Cloudflare Worker 연결 주소를 입력하세요.";
        return;
      }

      const button = $("translateButton");
      button.disabled = true;
      $("status").textContent = "사진에서 큰 제목을 읽고 번역하고 있어요…";

      try {
        const imageDataUri = await new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.onerror = () => reject(new Error("사진을 읽지 못했습니다."));
          reader.readAsDataURL(file);
        });

        const response = await fetch(workerAddress, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            imageDataUri,
            targetLanguage: $("targetLanguage").value
          })
        });

        const result = await response.json();
        if (!response.ok) {
          throw new Error(result.error || `요청 오류 (${response.status})`);
        }
        if (!result.title) {
          throw new Error("번역된 제목을 받지 못했습니다.");
        }

        saveInputs();
        card().title = result.title;
        loadCard();
        $("status").textContent =
          "큰 제목 번역이 끝났어요. 오른쪽에서 문구를 고칠 수 있습니다.";
      } catch (error) {
        $("status").textContent = `번역 오류: ${error.message}`;
      } finally {
        button.disabled = false;
      }
    });

    $("backgroundImage").addEventListener("change", async (event) => {
      const file = event.target.files[0];
      if (!file) return;

      try {
        saveInputs();
        card().image = await readImage(file);
        draw();
      } catch (error) {
        $("status").textContent = error.message;
      }
    });

    $("translatedTitle").addEventListener("input", () => {
      saveInputs();
      draw();
    });
    $("fontSize").addEventListener("input", () => {
      saveInputs();
      $("fontSizeValue").textContent = `${$("fontSize").value}px`;
      draw();
    });
    $("textColor").addEventListener("input", () => {
      saveInputs();
      draw();
    });
    $("gradientStrength").addEventListener("input", () => {
      saveInputs();
      $("gradientValue").textContent = `${$("gradientStrength").value}%`;
      draw();
    });
    $("fallbackColor").addEventListener("input", () => {
      saveInputs();
      draw();
    });

    $("previousButton").addEventListener("click", () => {
      saveInputs();
      current = Math.max(0, current - 1);
      loadCard();
    });
    $("nextButton").addEventListener("click", () => {
      saveInputs();
      current = Math.min(cards.length - 1, current + 1);
      loadCard();
    });
    $("addCardButton").addEventListener("click", () => {
      saveInputs();
      cards.push({
        title: "",
        image: null,
        x: 540,
        y: 675,
        fontSize: card().fontSize,
        color: card().color,
        gradient: card().gradient,
        fallback: card().fallback
      });
      current = cards.length - 1;
      $("backgroundImage").value = "";
      loadCard();
    });

    $("downloadButton").addEventListener("click", () => {
      draw();
      const link = document.createElement("a");
      link.download = `card-news-${current + 1}.png`;
      link.href = canvas.toDataURL("image/png");
      link.click();
    });

    function point(event) {
      const rect = canvas.getBoundingClientRect();
      return {
        x: (event.clientX - rect.left) * canvas.width / rect.width,
        y: (event.clientY - rect.top) * canvas.height / rect.height
      };
    }

    canvas.addEventListener("pointerdown", (event) => {
      const p = point(event);
      dragging = true;
      dragOffset = { x: p.x - card().x, y: p.y - card().y };
      canvas.setPointerCapture(event.pointerId);
    });
    canvas.addEventListener("pointermove", (event) => {
      if (!dragging) return;
      const p = point(event);
      card().x = Math.max(80, Math.min(1000, p.x - dragOffset.x));
      card().y = Math.max(50, Math.min(1300, p.y - dragOffset.y));
      draw();
    });
    canvas.addEventListener("pointerup", () => {
      dragging = false;
    });
    canvas.addEventListener("pointercancel", () => {
      dragging = false;
    });

    loadCard();
  </script>
</body>
</html>
