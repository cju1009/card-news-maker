<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>카드뉴스 메이커</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 20px; color: #f4f4f5;
      background: #101116; font: 15px Arial, sans-serif;
    }
    h1 { max-width: 1200px; margin: 0 auto 16px; font-size: 22px; }
    .layout {
      display: grid; grid-template-columns: 330px minmax(280px,1fr) 300px;
      gap: 16px; max-width: 1200px; margin: auto;
    }
    .panel, .preview {
      background: #181a22; border: 1px solid #292c36; border-radius: 12px; padding: 16px;
    }
    label { display: block; margin: 13px 0 6px; color: #d5d6dc; font-size: 13px; font-weight: bold; }
    input, select, textarea, button {
      width: 100%; padding: 10px; color: #f4f4f5; background: #111319;
      border: 1px solid #343743; border-radius: 7px; font: inherit;
    }
    textarea { min-height: 76px; resize: vertical; }
    input[type="file"] { padding: 8px; }
    input[type="color"] { height: 40px; padding: 3px; }
    input[type="range"] { padding: 0; }
    button {
      margin-top: 10px; border: 0; background: #6544f5;
      font-weight: bold; cursor: pointer;
    }
    button:hover { background: #785eff; }
    button:disabled { opacity: .55; cursor: wait; }
    .secondary { background: #292c36; }
    .hint { color: #a6a8b2; font-size: 12px; line-height: 1.5; }
    #status { min-height: 22px; color: #b9aaff; font-size: 13px; }
    .preview { display: flex; flex-direction: column; align-items: center; }
    canvas {
      width: min(100%, 432px); height: auto; border-radius: 8px;
      background: #242236; touch-action: none;
    }
    .nav { display: flex; gap: 8px; width: min(100%, 432px); }
    .nav button { flex: 1; }
    @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <h1>카드뉴스 메이커</h1>

  <main class="layout">
    <section class="panel">
      <label for="workerUrl">AI 연결 주소</label>
      <input id="workerUrl" type="url" placeholder="Cloudflare Worker 주소를 나중에 입력">
      <p class="hint">API 키는 이 화면이나 GitHub 코드에 입력하지 마세요.</p>

      <label for="sourceImage">인스타그램 참고 이미지 (선택)</label>
      <input id="sourceImage" type="file" accept="image/*">

      <label for="caption">캡션 / 본문 텍스트</label>
      <textarea id="caption" placeholder="번역·카드 제작에 사용할 글을 붙여넣으세요."></textarea>

      <label for="targetLanguage">카드 언어</label>
      <select id="targetLanguage">
        <option value="ko">한국어</option>
        <option value="en">English</option>
        <option value="ja">日本語</option>
      </select>

      <button id="makeCards">분석하고 카드 생성</button>
      <p id="status" role="status"></p>
      <p class="hint">참고 이미지와 본문은 AI 분석을 요청할 때 OpenAI API로 전송됩니다. 카드에 쓸 사진은 아래에서 따로 업로드합니다.</p>

      <label for="cardImage">카드 썸네일 / 배경 사진</label>
      <input id="cardImage" type="file" accept="image/*">
      <p class="hint">직접 준비한 사진을 선택하세요. 사진은 카드 미리보기의 배경으로 들어갑니다.</p>
    </section>

    <section class="preview">
      <canvas id="canvas" width="1080" height="1350"></canvas>
      <div class="nav">
        <button id="previousCard" class="secondary">이전 카드</button>
        <button id="nextCard" class="secondary">다음 카드</button>
      </div>
      <p class="hint">1080 × 1350 · 미리보기의 제목이나 본문을 끌어 위치를 조절할 수 있어요.</p>
      <button id="download">현재 카드 PNG 다운로드</button>
    </section>

    <section class="panel">
      <label for="cardTitle">제목</label>
      <textarea id="cardTitle" placeholder="AI 카드 제목 또는 직접 입력"></textarea>

      <label for="cardBody">본문</label>
      <textarea id="cardBody" placeholder="AI 카드 본문 또는 직접 입력"></textarea>

      <label for="textPart">편집할 글자</label>
      <select id="textPart">
        <option value="title">제목</option>
        <option value="body">본문</option>
      </select>

      <label for="fontSize">글자 크기</label>
      <input id="fontSize" type="range" min="24" max="110" value="64">

      <label for="textColor">글자 색</label>
      <input id="textColor" type="color" value="#ffffff">

      <label for="imageSuggestion">사진 아이디어</label>
      <textarea id="imageSuggestion" readonly placeholder="카드 내용에 어울리는 사진 아이디어"></textarea>
    </section>
  </main>

  <script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const statusBox = document.getElementById("status");
    const workerUrlInput = document.getElementById("workerUrl");

    let sourceImageData = "";
    let cardPhoto = null;
    let cards = [];
    let cardIndex = 0;
    let dragPart = "";
    let dragStartY = 0;

    workerUrlInput.value = localStorage.getItem("cardWorkerUrl") || "";
    workerUrlInput.addEventListener("change", () => {
      localStorage.setItem("cardWorkerUrl", workerUrlInput.value.trim());
    });

    function readDataUrl(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    document.getElementById("sourceImage").addEventListener("change", async event => {
      const file = event.target.files[0];
      if (!file) return;
      if (file.size > 8 * 1024 * 1024) {
        statusBox.textContent = "참고 이미지는 8MB 이하 파일을 선택해 주세요.";
        return;
      }
      sourceImageData = await readDataUrl(file);
      statusBox.textContent = "참고 이미지를 불러왔어요.";
    });

    document.getElementById("cardImage").addEventListener("change", event => {
      const file = event.target.files[0];
      if (!file) return;
      const image = new Image();
      image.onload = () => {
        cardPhoto = image;
        paint();
        statusBox.textContent = "카드 배경 사진을 불러왔어요.";
      };
      image.src = URL.createObjectURL(file);
    });

    function currentCard() {
      return cards[cardIndex] || {
        title: "제목", body: "캡션을 입력하고 카드를 생성해 보세요.",
        titleY: 760, bodyY: 930, titleSize: 72, bodySize: 42
      };
    }

    function wrapText(text, maxWidth, size) {
      ctx.font = `bold ${size}px Arial, sans-serif`;
      const lines = [];
      for (const paragraph of String(text || "").split("\n")) {
        let line = "";
        for (const char of paragraph) {
          const next = line + char;
          if (line && ctx.measureText(next).width > maxWidth) {
            lines.push(line);
            line = char;
          } else line = next;
        }
        lines.push(line);
      }
      return lines.length ? lines : [""];
    }

    function drawBlock(text, y, size, color, maxHeight) {
      let fontSize = size;
      let lines = wrapText(text, 920, fontSize);
      while (fontSize > 24 && lines.length * fontSize * 1.2 > maxHeight) {
        fontSize -= 2;
        lines = wrapText(text, 920, fontSize);
      }
      ctx.font = `bold ${fontSize}px Arial, sans-serif`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.lineWidth = Math.max(3, fontSize / 16);
      ctx.strokeStyle = "rgba(0,0,0,.72)";
      ctx.fillStyle = color;
      const lineHeight = fontSize * 1.2;
      lines.forEach((line, index) => {
        const lineY = y + (index - (lines.length - 1) / 2) * lineHeight;
        ctx.strokeText(line, canvas.width / 2, lineY);
        ctx.fillText(line, canvas.width / 2, lineY);
      });
    }

    function paint() {
      const card = currentCard();
      ctx.fillStyle = "#252238";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      if (cardPhoto) {
        const scale = Math.max(canvas.width / cardPhoto.width, canvas.height / cardPhoto.height);
        const w = cardPhoto.width * scale, h = cardPhoto.height * scale;
        ctx.drawImage(cardPhoto, (canvas.width - w) / 2, (canvas.height - h) / 2, w, h);
      }

      const shade = ctx.createLinearGradient(0, 400, 0, 1350);
      shade.addColorStop(0, "rgba(0,0,0,0)");
      shade.addColorStop(1, "rgba(0,0,0,.82)");
      ctx.fillStyle = shade;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      drawBlock(card.title, card.titleY, card.titleSize, document.getElementById("textColor").value, 300);
      drawBlock(card.body, card.bodyY, card.bodySize, document.getElementById("textColor").value, 420);
    }

    function showCard() {
      const card = currentCard();
      document.getElementById("cardTitle").value = card.title || "";
      document.getElementById("cardBody").value = card.body || "";
      document.getElementById("fontSize").value =
        document.getElementById("textPart").value === "title" ? card.titleSize || 72 : card.bodySize || 42;
      document.getElementById("imageSuggestion").value = card.imageSuggestion || "";
      paint();
    }

    document.getElementById("makeCards").addEventListener("click", async () => {
      const url = workerUrlInput.value.trim();
      const caption = document.getElementById("caption").value.trim();
      if (!caption) {
        statusBox.textContent = "먼저 캡션 / 본문 텍스트를 입력해 주세요.";
        return;
      }
      if (!url) {
        statusBox.textContent = "AI 연결 주소를 설정한 뒤 사용할 수 있어요. 다음 단계에서 연결할게요.";
        return;
      }

      const button = document.getElementById("makeCards");
      button.disabled = true;
      statusBox.textContent = "내용을 분석하고 번역하는 중…";

      try {
        const response = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            caption,
            targetLanguage: document.getElementById("targetLanguage").value,
            referenceImage: sourceImageData
          })
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || "요청을 처리하지 못했어요.");
        if (!Array.isArray(result.cards) || !result.cards.length) throw new Error("카드 내용을 받지 못했어요.");

        cards = result.cards.map(card => ({
          title: card.title || "",
          body: card.body || "",
          imageSuggestion: card.imageSuggestion || "",
          titleY: 760, bodyY: 1010, titleSize: 72, bodySize: 42
        }));
        cardIndex = 0;
        showCard();
        statusBox.textContent = `${cards.length}개 카드 초안을 만들었어요. 문구를 확인하고 수정해 주세요.`;
      } catch (error) {
        statusBox.textContent = error.message || "연결에 실패했어요. 주소와 인터넷 연결을 확인해 주세요.";
      } finally {
        button.disabled = false;
      }
    });

    document.getElementById("cardTitle").addEventListener("input", event => {
      if (!cards.length) cards = [currentCard()];
      cards[cardIndex].title = event.target.value;
      paint();
    });

    document.getElementById("cardBody").addEventListener("input", event => {
      if (!cards.length) cards = [currentCard()];
      cards[cardIndex].body = event.target.value;
      paint();
    });

    document.getElementById("textPart").addEventListener("change", showCard);

    document.getElementById("fontSize").addEventListener("input", event => {
      if (!cards.length) cards = [currentCard()];
      const key = document.getElementById("textPart").value === "title" ? "titleSize" : "bodySize";
      cards[cardIndex][key] = Number(event.target.value);
      paint();
    });

    document.getElementById("textColor").addEventListener("input", paint);

    document.getElementById("previousCard").addEventListener("click", () => {
      if (!cards.length) return;
      cardIndex = (cardIndex - 1 + cards.length) % cards.length;
      showCard();
    });

    document.getElementById("nextCard").addEventListener("click", () => {
      if (!cards.length) return;
      cardIndex = (cardIndex + 1) % cards.length;
      showCard();
    });

    canvas.addEventListener("pointerdown", event => {
      const rect = canvas.getBoundingClientRect();
      const y = (event.clientY - rect.top) * canvas.height / rect.height;
      const card = currentCard();
      dragPart = Math.abs(y - card.titleY) < Math.abs(y - card.bodyY) ? "title" : "body";
      dragStartY = y;
      canvas.setPointerCapture(event.pointerId);
    });

    canvas.addEventListener("pointermove", event => {
      if (!dragPart) return;
      const rect = canvas.getBoundingClientRect();
      const y = (event.clientY - rect.top) * canvas.height / rect.height;
      const card = currentCard();
      const key = dragPart === "title" ? "titleY" : "bodyY";
      card[key] = Math.max(100, Math.min(1250, card[key] + y - dragStartY));
      dragStartY = y;
      paint();
    });

    canvas.addEventListener("pointerup", () => { dragPart = ""; });

    document.getElementById("download").addEventListener("click", () => {
      const link = document.createElement("a");
      link.download = `card-${cardIndex + 1}.png`;
      link.href = canvas.toDataURL("image/png");
      link.click();
    });

    paint();
  </script>
</body>
</html>
